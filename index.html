<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SnapSlide — Hako Games</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0b0c12;color:#c8cad6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
.card{max-width:440px;width:100%;text-align:center;}
.logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:26px;}
.mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#c4b5fd,#7c3aed);position:relative;}
.mark::after{content:'';position:absolute;top:11px;left:10px;width:12px;height:8px;border-radius:50%;background:rgba(237,233,254,.45);}
.name{font-size:24px;font-weight:700;letter-spacing:4px;color:#fff;}
.name span{color:#a78bfa;}
.tag{font-size:12px;color:#4a4d5e;letter-spacing:3px;margin-bottom:34px;}
p{font-size:14px;line-height:1.8;color:#8b8fa3;margin-bottom:30px;}
.links{display:flex;flex-direction:column;gap:9px;}
.links a{display:block;padding:13px;background:#12141c;border:1px solid #1f2130;border-radius:10px;
color:#a8abbd;text-decoration:none;font-size:14px;transition:all .15s;}
.links a:hover{border-color:#5a52e0;color:#c4c7d8;}
footer{margin-top:34px;font-size:12px;color:#33364a;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="mark"></div>
    <div class="name">SNAP<span>SLIDE</span></div>
  </div>
  <div class="tag">SLIDE · SNAP · COLLECT</div>
  <p>Hako Games tarafından geliştirilen bulmaca oyunu.<br>Kayarak ilerle, noktaları topla.</p>
  <div class="links">
    <a href="privacy.html">Gizlilik Politikası</a>
    <a href="terms.html">Kullanım Koşulları</a>
    <a href="privacy-en.html">Privacy Policy (EN)</a>
    <a href="terms-en.html">Terms of Use (EN)</a>
  </div>
  <footer>
    &copy; 2026 Hako Games<br>
    snapslideapp@gmail.com
  </footer>
</div>
</body>
</html>
